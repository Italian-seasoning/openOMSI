name: Content protection

on:
  workflow_dispatch:
  push:
    branches: [feat/content-protection]
  pull_request:
    paths: ["crates/omsi-pack/**", "crates/omsi-cfg/**", "crates/omsi-scene/**", "Cargo.*", ".github/workflows/content-protection.yml"]

permissions:
  contents: read

concurrency:
  group: content-protection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: content-protection-${{ matrix.os }}
      - name: Format inputs
        shell: bash
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Publisher loader contract
        run: cargo test -p omsi-cfg --test publisher
      - name: Publisher pack contract
        if: always()
        run: cargo test -p omsi-pack --test pack
      - name: Offline publisher CLI
        if: always()
        run: cargo test -p omsi-pack --test cli
      - name: Native format and loader tests
        run: cargo test -p omsi-cfg -p omsi-map -p omsi-o3d -p omsi-texture

      - name: Resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lock-${{ matrix.os }}
          path: Cargo.lock
          retention-days: 2
